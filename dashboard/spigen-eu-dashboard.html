<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0b1322; --surface:#131f38; --surface-alt:#18274a;
  --border:rgba(255,255,255,.07); --border-sub:rgba(255,255,255,.05);
  --ink:#eef2f8; --ink-sub:#c3cbdc; --ink-dim:#8b96ab; --ink-muted:#5c6b85;
  --de:#4fd1c5; --it:#e0b15c; --synth:#e0b15c;
  --good:#4fd1c5; --warn:#e0b15c; --crit:#e0575c;
  --good-bg:rgba(79,209,197,.14); --warn-bg:rgba(224,177,92,.14); --crit-bg:rgba(224,87,92,.14); --synth-bg:rgba(224,177,92,.14);
  --hover:#182544;
  --radius:14px;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);display:flex;height:100svh;overflow:hidden;font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}

/* ---- sidebar ---- */
#sidebar{width:210px;min-width:210px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:20px 20px 14px;border-bottom:1px solid var(--border-sub);display:flex;align-items:center;gap:10px}
.sb-logo .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.sb-logo .word{font-weight:700;font-size:14.5px}
.sb-logo .sub{font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.sb-filters{padding:16px 16px 8px;border-bottom:1px solid var(--border-sub)}
.sb-filter-label{font-size:11px;color:var(--ink-dim);font-weight:600;letter-spacing:.05em;margin-bottom:5px;text-transform:uppercase}
.sb-select{width:100%;border:1px solid var(--border);padding:5px 8px;font-size:12px;color:var(--ink-sub);background:var(--surface);margin-bottom:4px;cursor:pointer;font-family:inherit;appearance:none;background-repeat:no-repeat;background-position:right 8px center;padding-right:22px}
.sb-nav{padding:12px 0;flex:1}
.sb-nav-item{display:flex;align-items:center;gap:8px;padding:9px 20px;font-size:13px;color:var(--ink-dim);cursor:pointer;user-select:none}
.sb-nav-item:hover{background:var(--hover);color:var(--ink)}
.sb-nav-item.active{color:var(--good);font-weight:600;background:var(--hover)}
.sb-nav-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.sb-nav-item.active .sb-nav-dot{background:var(--good)}
.sb-footer{padding:10px 20px 14px;font-size:11px;color:var(--ink-muted);border-top:1px solid var(--border-sub);line-height:1.6}
.sb-footer .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* ---- main ---- */
#main{flex:1;overflow-y:auto;background:var(--bg)}
.page-header{background:var(--bg);border-bottom:1px solid var(--border);padding:22px 30px 16px}
.page-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.page-title{font-size:23px;font-weight:700;letter-spacing:-.015em}
.page-subtitle{font-size:12px;color:var(--ink-dim);margin-top:4px}
.page-refresh{font-size:11px;color:var(--ink-muted);white-space:nowrap}
.page-body{padding:20px 30px 48px}

/* ---- kpi row ---- */
.kpi-row{display:flex;background:transparent;border:none;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:150px;padding:18px 20px;background:var(--surface);border-radius:var(--radius)}
.kpi-main{background:var(--surface);flex:1.5;min-width:200px;padding:18px 22px;border-radius:var(--radius)}
.kpi-label{font-size:12.5px;color:var(--ink-dim)}
.kpi-main .kpi-label{font-size:13px;font-weight:600;color:var(--ink-sub)}
.kpi-value{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.kpi-main .kpi-value{font-size:31px}
.kpi-delta{font-size:12.5px;margin-top:5px;display:flex;align-items:center;gap:4px;font-weight:600}
.kpi-delta.good{color:var(--good)} .kpi-delta.warn{color:var(--warn)} .kpi-delta.crit{color:var(--crit)}
.kpi-sub{font-size:11px;color:var(--ink-muted);margin-top:4px}
.kpi-tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
.kpi-tag.real{background:var(--good-bg);color:var(--good)}
.kpi-tag.synth{background:var(--synth-bg);color:var(--synth)}

/* ---- chart card ---- */
.chart-card{background:var(--surface);border:none;border-radius:var(--radius);padding:20px 22px;overflow:hidden}
.chart-title{font-size:15px;font-weight:600;margin-bottom:3px}
.chart-subtitle{font-size:11.5px;color:var(--ink-muted);margin-bottom:10px}
.chart-insight{font-size:11.5px;color:var(--ink-sub);background:var(--hover);border-left:2px solid var(--good);padding:7px 10px;margin:2px 0 12px;border-radius:0 6px 6px 0;line-height:1.55}
.chart-grid{display:grid;gap:14px;margin-bottom:18px}
.chart-grid.col-2{grid-template-columns:1fr 1fr}
.chart-grid.col-3{grid-template-columns:1fr 1fr 1fr}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:9.5px;fill:var(--ink-muted)}
.chart .gridl{stroke:var(--border-sub);stroke-width:1}
.chart .base{stroke:var(--border);stroke-width:1}
.chart .mark-band{fill:var(--ink);opacity:.05}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--ink-sub)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;flex-shrink:0;border-radius:2px}

/* ---- section divider ---- */
.section-divider{display:flex;align-items:center;gap:14px;margin:22px 0 15px}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.section-divider-text{font-size:13px;font-weight:700;color:var(--ink-sub);white-space:nowrap}

/* ---- trend / cause cards ---- */
.trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.trend-card{background:var(--surface);border:none;border-radius:var(--radius);padding:17px 19px}
.trend-card .k{font-family:var(--mono);font-size:10.5px;color:var(--good);font-weight:600}
.trend-card h4{font-size:14.5px;font-weight:700;margin:5px 0 8px}
.trend-card p{margin:0;font-size:12px;color:var(--ink-sub);line-height:1.6}
.trend-card p+p{margin-top:6px}

/* ---- table ---- */
.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.data-table th{background:var(--surface-alt);color:var(--ink-dim);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border-sub);color:var(--ink-sub);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--hover)}
.pri{display:inline-block;padding:2px 8px;font-size:10.5px;font-weight:600;border-radius:999px}
.pri.high{background:var(--crit-bg);color:var(--crit)} .pri.mid{background:var(--warn-bg);color:var(--warn)}

#tip{position:fixed;pointer-events:none;background:#eef2f8;color:#0b1322;font-size:11.5px;line-height:1.5;padding:7px 9px;border-radius:7px;z-index:50;max-width:230px;opacity:0;transition:opacity .08s;font-weight:500}
#tip .t{font-family:var(--mono);font-size:10.5px;opacity:.75;margin-bottom:2px}

@media (max-width:900px){
  .chart-grid.col-2,.chart-grid.col-3,.trend-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{display:block;height:auto;overflow:visible}
  #sidebar{width:100%;min-width:0;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  #main{overflow:visible}
}

function showTip(html,x,y){tip.innerHTML=html;tip.style.opacity=1;const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;tip.style.left=Math.max(8,L)+'px';tip.style.top=Math.max(8,T)+'px';}

/* ============ shared chart primitives ============ */
function hbars(el,{cats,series,max,unit,dec,dimBySeries}){
  el.innerHTML='';
  const Wd=560,rowH=series.length>1?24:20,gap=6,H=cats.length*(rowH*series.length+gap)+6,m={l:96,r:56,t:2,b:2};
  const svg=sv('svg',{viewBox:`0 0 ${Wd} ${H}`,role:'img'},el);
  let y0=m.t;
  cats.forEach((c)=>{
    const lab=sv('text',{x:m.l-8,y:y0+ (series.length*rowH)/2 +4,'text-anchor':'end'},svg);lab.textContent=c;
    series.forEach((s,si)=>{
      const v=s.values[cats.indexOf(c)];
      const w=(v/max)*(Wd-m.l-m.r);
      const yy=y0+si*rowH;
      const rect=sv('rect',{x:m.l,y:yy,width:Math.max(2,w),height:rowH-6,rx:2,fill:s.color,opacity:dimBySeries?dim(s.key):1},svg);
      const t=sv('text',{x:m.l+w+6,y:yy+(rowH-6)/2+3.5,style:'fill:'+css('--ink-sub')},svg);t.textContent=(dec!=null?v.toFixed(dec):v)+(unit||'');
      rect.addEventListener('mousemove',e=>showTip('<div class="t">'+c+'</div>'+s.name+' <b>'+(dec!=null?v.toFixed(dec):v)+(unit||'')+'</b>',e.clientX,e.clientY));
      rect.addEventListener('mouseleave',hideTip);
    });
    y0+=series.length*rowH+gap;
  });
  el.appendChild(svg);
}

function lineChart(el,{series,height,xlabels,markers}){
  el.innerHTML='';
  const Wd=880,H=height||190,m={l:34,r:16,t:14,b:20};
  const n=series[0].values.length;
  const svg=sv('svg',{viewBox:`0 0 ${Wd} ${H}`,role:'img'},el);
  const x=i=>m.l+i*(Wd-m.l-m.r)/(n-1), y=v=>m.t+(1-v/100)*(H-m.t-m.b);
  (markers||[]).forEach(mk=>sv('rect',{x:x(mk.i)-2,y:m.t,width:4,height:H-m.t-m.b,class:'mark-band'},svg));
  [0,50,100].forEach(v=>{sv('line',{x1:m.l,x2:Wd-m.r,y1:y(v),y2:y(v),class:v===0?'base':'gridl'},svg);
    const t=sv('text',{x:m.l-6,y:y(v)+3,'text-anchor':'end'},svg);t.textContent=v;});
  (xlabels||[]).forEach(xl=>{const t=sv('text',{x:x(xl.i),y:H-4,'text-anchor':'middle'},svg);t.textContent=xl.label;});
  series.forEach(s=>{
    const d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    sv('path',{d,fill:'none',stroke:s.color,'stroke-width':2,opacity:dim(s.key)},svg);
  });
  const hit=sv('rect',{x:m.l,y:0,width:Wd-m.l-m.r,height:H,fill:'transparent'},svg);
  hit.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*Wd;
    const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/((Wd-m.l-m.r)/(n-1)))));
    let h='<div class="t">'+(i+1)+'주차</div>';
    series.forEach(s=>h+='<div>'+s.name+' <b>'+s.values[i]+'</b></div>');
    showTip(h,e.clientX,e.clientY);
  });
  hit.addEventListener('mouseleave',hideTip);
  el.appendChild(svg);
}

function scatterChart(el,xs,ys,color,key){
  el.innerHTML='';
  const Wd=400,H=180,m={l:38,r:10,t:8,b:20};
  const svg=sv('svg',{viewBox:`0 0 ${Wd} ${H}`,role:'img'},el);
  const xMin=Math.min(...xs)*.95,xMax=Math.max(...xs)*1.03,yMin=0,yMax=Math.max(...ys)*1.1;
  const x=v=>m.l+(v-xMin)/(xMax-xMin)*(Wd-m.l-m.r), y=v=>m.t+(1-(v-yMin)/(yMax-yMin))*(H-m.t-m.b);
  [0,.5,1].forEach(f=>{const v=yMax*f; sv('line',{x1:m.l,x2:Wd-m.r,y1:y(v),y2:y(v),class:f===0?'base':'gridl'},svg);
    const t=sv('text',{x:m.l-5,y:y(v)+3,'text-anchor':'end'},svg);t.textContent=Math.round(v);});
  const nn=xs.length, mx=xs.reduce((a,b)=>a+b,0)/nn, my=ys.reduce((a,b)=>a+b,0)/nn;
  let num=0,den=0; for(let i=0;i<nn;i++){num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2;}
  const slope=num/den, intercept=my-slope*mx;
  sv('path',{d:`M${x(xMin)} ${y(slope*xMin+intercept)} L${x(xMax)} ${y(slope*xMax+intercept)}`,fill:'none',stroke:css('--ink'),'stroke-width':1.5,'stroke-dasharray':'5 4',opacity:dim(key)},svg);
  xs.forEach((xv,i)=>{
    const c=sv('circle',{cx:x(xv),cy:y(ys[i]),r:3,fill:color,opacity:.7*dim(key)},svg);
    c.addEventListener('mousemove',e=>showTip('수요지수 '+xv.toFixed(2)+'<br>지출 <b>€'+Math.round(ys[i]).toLocaleString()+'</b>',e.clientX,e.clientY));
    c.addEventListener('mouseleave',hideTip);
  });
  el.appendChild(svg);
}

function renderMarket(){
  return `

/* ============ render / navigate ============ */
function renderPage(){
  const el=document.getElementById('page-content');
  if(tab==='market') el.innerHTML=renderMarket();
  else if(tab==='cause') el.innerHTML=renderCause();
  else el.innerHTML=renderSim();
  afterRender();
}
window.navigate=navigate;
window.setMarketFilter=setMarketFilter;

function afterRender(){
  if(tab==='market'){
    hbars(document.getElementById('c-vendor'),{cats:VENDOR.cats,series:[{key:'DE',name:'독일',color:css('--de'),values:VENDOR.de},{key:'IT',name:'이탈리아',color:css('--it'),values:VENDOR.it}],max:40,unit:'%',dec:1,dimBySeries:true});
    lineChart(document.getElementById('c-demand'),{series:[{key:'DE',name:'독일',color:css('--de'),values:deGen},{key:'IT',name:'이탈리아',color:css('--it'),values:itIph}],markers:EVMARK});
  } else if(tab==='cause'){
    const k = market==='all' ? {gap:(KPI.DE.gap+KPI.IT.gap)/2, r2:(KPI.DE.r2+KPI.IT.r2)/2, ctr:(KPI.DE.ctr+KPI.IT.ctr)/2} : KPI[market];
    document.getElementById('kv-gap').innerHTML=k.gap.toFixed(1)+'<span style="font-size:14px">%p</span>';
    document.getElementById('kd-gap').textContent = market==='all' ? 'DE 5.4%p · IT 6.3%p 평균' : (market==='DE'?'독일 기준':'이탈리아 기준');
    document.getElementById('kv-r2').textContent=k.r2.toFixed(3);
    document.getElementById('kv-ctr').textContent=k.ctr.toFixed(2);
  } else {
    const k = market==='all' ? {uplift:(KPI.DE.uplift+KPI.IT.uplift)/2} : KPI[market];
    document.getElementById('kv-uplift').innerHTML='+'+k.uplift.toFixed(2)+'<span style="font-size:14px">%</span>';
    scatterChart(document.getElementById('c-scatter-de'),SC.DE.demand,SC.DE.spend,css('--de'),'DE');
    scatterChart(document.getElementById('c-scatter-it'),SC.IT.demand,SC.IT.spend,css('--it'),'IT');
    hbars(document.getElementById('c-quintile'),{cats:['Q1 최저','Q2','Q3','Q4','Q5 최고'],series:[{key:'DE',name:'독일',color:css('--de'),values:QUINTILE.DE},{key:'IT',name:'이탈리아',color:css('--it'),values:QUINTILE.IT}],max:18,unit:'€',dec:2,dimBySeries:true});
  }
}

renderPage();
const mq=matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener&&mq.addEventListener('change',renderPage);
new MutationObserver(renderPage).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
